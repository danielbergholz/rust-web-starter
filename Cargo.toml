[package]
name = "rust-web-starter"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
